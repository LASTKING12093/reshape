name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Test installer download and integrity failures
        shell: pwsh
        run: ./scripts/test-setup.ps1
      - name: Prepare processing engines
        shell: pwsh
        run: ./scripts/prepare-engines.ps1
      - run: node scripts/fixtures.mjs
      - run: npm test
      - name: Verify installer UI compilation
        shell: pwsh
        run: ./scripts/build-setup.ps1 -Preview
